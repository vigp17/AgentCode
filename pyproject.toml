[project]
name = "agentcode-cli"
version = "1.3.0"
description = "An open, multi-model agentic coding CLI — inspired by Claude Code"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Vignesh Pai"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "litellm>=1.40.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/vigp17/AgentCode"
Repository = "https://github.com/vigp17/AgentCode"
"Bug Tracker" = "https://github.com/vigp17/AgentCode/issues"

[project.scripts]
agentcode = "cli:main"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools]
py-modules = ["cli", "agent", "tools", "router", "mcp_client", "settings", "server", "xml_tool_parser"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
