[project]
name = "agentcode"
version = "0.1.0"
description = "An open, multi-model agentic coding CLI — inspired by Claude Code"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
agentcode = "cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
